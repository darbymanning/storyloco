name: Publish

# Puts main's version on npm, through npm's trusted publishing: no token, and the package carries
# provenance. release.yml dispatches it after pushing a release; run it by hand to retry one.

on:
  workflow_dispatch:

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # trusted publishing needs npm 11.5.1 or later, which Node 24 brings
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # a re-run is a re-run: the same commit already on npm is fine, any other isn't
          if published="$(npm view "storyloco@$version" gitHead 2>/dev/null)"; then
            if [ "$published" = "$(git rev-parse HEAD)" ]; then
              echo "• storyloco@$version is on npm already, from this commit"
              exit 0
            fi
            echo "✗ storyloco@$version is on npm already, from ${published:-another commit}; this needs a new version" >&2
            exit 1
          fi
          npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "• release $tag exists already"
            exit 0
          fi
          gh release create "$tag" --title "$VERSION" --generate-notes --verify-tag
